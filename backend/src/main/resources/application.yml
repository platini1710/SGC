spring:
  application:
    name: schedule-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduledb}
    username: ${DB_USERNAME:usuariolocal}
    password: ${DB_PASSWORD:superpassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8081
schedule:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201}
logging:
  level:
    com.example.schedule: DEBUG
jwt:
  # Secret de DESARROLLO: cadena Base64 que codifica 256 bits (32 bytes).
  # En producción debe sobreescribirse con la variable de entorno JWT_SECRET.
  secret: ${JWT_SECRET:c2Nob29sLXNjaGVkdWxlLWRldi1zZWNyZXQta2V5LTAxMjM0NTY3ODk=}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:school-schedule}
