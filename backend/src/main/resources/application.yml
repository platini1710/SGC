spring:
  application:
    name: schedule-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduledb}
    username: ${DB_USERNAME:usuariolocal}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8081
  tomcat:
    # Permite requests grandes (fotos en Base64 dentro del JSON). 15 MB.
    max-http-form-post-size: 15MB
    max-swallow-size: 15MB
spring.mail:
  # Credenciales SMTP SOLO por variables de entorno (nunca en el repo).
  # Sin MAIL_HOST el envío real queda desactivado y el OTP se escribe en el log.
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 5000
    mail.smtp.writetimeout: 5000
schedule:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  otp:
    # Modo demo: expone el código en la respuesta. Se apaga solo si hay SMTP configurado.
    expose-code: ${OTP_EXPOSE_CODE:true}
logging:
  level:
    com.example.schedule: DEBUG
jwt:
  # Secret de DESARROLLO: cadena Base64 que codifica 256 bits (32 bytes).
  # En producción debe sobreescribirse con la variable de entorno JWT_SECRET.
  secret: ${JWT_SECRET:c2Nob29sLXNjaGVkdWxlLWRldi1zZWNyZXQta2V5LTAxMjM0NTY3ODk=}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:school-schedule}
