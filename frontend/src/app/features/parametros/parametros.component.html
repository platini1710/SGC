<div>
  <h2 class="page-title">⚙️ Parámetros del Sistema</h2>

  @if (mensajeOk) { <div class="alert alert-success">{{ mensajeOk }}</div> }
  @if (errorMsg) { <div class="alert alert-error">{{ errorMsg }}</div> }

  @if (cargando) {
    <div style="text-align:center;padding:20px"><span class="spinner"></span></div>
  } @else {
    <div class="card" style="max-width:520px">
      <div class="form-group">
        <label>
          <input type="checkbox" [(ngModel)]="aproxima" style="width:auto;margin-right:8px">
          Aproximar notas al decimal superior
        </label>
        <small style="display:block;color:#757575;margin-top:4px">
          Si está activo, un promedio como 6,35 se muestra 6,4. Si no, se trunca a 6,3.
        </small>
      </div>

      <div class="form-group">
        <label>Cierre de sesión por inactividad (segundos)</label>
        <input type="number" min="10" step="10" [(ngModel)]="timeoutInactividad" style="max-width:160px">
        <small style="display:block;color:#757575;margin-top:4px">
          Tiempo sin actividad antes de cerrar la sesión automáticamente.
        </small>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-primary" [disabled]="guardando" (click)="guardar()">
          {{ guardando ? 'Guardando...' : '💾 Guardar' }}
        </button>
      </div>
    </div>
  }
</div>
